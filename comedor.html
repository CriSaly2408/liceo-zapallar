<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comedor · Liceo Bicentenario Zapallar</title>
<style>
  :root {
    --navy: #1a2744;
    --navy-light: #253459;
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --cream: #f8f6f0;
    --white: #ffffff;
    --green: #2e7d32;
    --green-bg: #e8f5e9;
    --red: #c62828;
    --red-bg: #ffebee;
    --gray: #6b7280;
    --gray-light: #e5e7eb;
    --text: #1f2937;
    --shadow: 0 4px 24px rgba(26,39,68,0.13);
    --radius: 12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--cream); color: var(--text); min-height:100vh; }

  /* Header */
  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    color: var(--white);
    padding: 0;
    box-shadow: var(--shadow);
    position: sticky; top:0; z-index:100;
  }
  .header-inner {
    max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
  }
  .header-left { display:flex; align-items:center; gap:14px; }
  .logo-circle {
    width:48px; height:48px; border-radius:50%;
    background: var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:900; color:var(--navy); flex-shrink:0;
  }
  .header-title h1 { font-size:1.15rem; font-weight:700; letter-spacing:0.01em; }
  .header-title p { font-size:0.78rem; opacity:0.75; margin-top:1px; }
  #live-clock { font-size:0.9rem; opacity:0.85; font-variant-numeric: tabular-nums; }

  /* Tab nav */
  nav.tabs {
    background: var(--navy-light);
    display:flex; gap:0;
    max-width:100%; overflow-x:auto;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  nav.tabs button {
    flex:1; min-width:120px;
    padding:11px 18px;
    background:none; border:none; color:rgba(255,255,255,0.65);
    font-size:0.88rem; font-weight:500; cursor:pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.15s;
    white-space:nowrap;
  }
  nav.tabs button.active { color:var(--gold); border-bottom-color:var(--gold); }
  nav.tabs button:hover:not(.active) { color:rgba(255,255,255,0.9); background:rgba(255,255,255,0.06); }

  /* Main layout */
  main { max-width:1100px; margin:0 auto; padding:28px 20px; }

  /* Panels */
  .panel { display:none; }
  .panel.active { display:block; }

  /* Card */
  .card {
    background:var(--white); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:28px;
    margin-bottom:24px;
  }
  .card h2 { font-size:1.1rem; font-weight:700; color:var(--navy); margin-bottom:18px; display:flex; align-items:center; gap:8px; }

  /* Search bar */
  .search-wrap { position:relative; margin-bottom:20px; }
  .search-wrap input {
    width:100%; padding:13px 18px 13px 46px;
    border: 2px solid var(--gray-light);
    border-radius:10px; font-size:1rem;
    transition: border-color 0.15s;
    background:var(--white);
  }
  .search-wrap input:focus { outline:none; border-color:var(--gold); }
  .search-wrap .icon {
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    font-size:1.1rem; pointer-events:none;
  }
  .search-wrap input::placeholder { color:#aaa; }

  /* Filters */
  .filters { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .filters select, .filters input[type="date"] {
    padding:9px 14px; border:2px solid var(--gray-light);
    border-radius:8px; font-size:0.9rem; background:white; cursor:pointer;
    transition:border-color 0.15s;
  }
  .filters select:focus, .filters input[type="date"]:focus { outline:none; border-color:var(--gold); }

  /* Result card */
  .found-card {
    background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 100%);
    border: 2px solid #bfcbf5;
    border-radius: var(--radius);
    padding:20px 24px;
    margin-bottom:20px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
  }
  .found-card .student-info .name {
    font-size:1.2rem; font-weight:700; color:var(--navy);
  }
  .found-card .student-info .meta {
    font-size:0.88rem; color:var(--gray); margin-top:4px;
  }
  .found-card .badge-curso {
    background:var(--navy); color:var(--gold);
    font-weight:700; font-size:0.88rem;
    padding:4px 12px; border-radius:20px;
  }
  .btn-register {
    background: var(--gold);
    color: var(--navy);
    border:none; padding:12px 28px;
    border-radius:8px; font-size:1rem; font-weight:700;
    cursor:pointer; transition:all 0.15s;
  }
  .btn-register:hover { background:var(--gold-light); transform:translateY(-1px); }
  .btn-register:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

  .msg-success {
    background:var(--green-bg); border:2px solid #a5d6a7;
    color:var(--green); border-radius:10px;
    padding:14px 18px; margin-bottom:16px;
    font-weight:600; font-size:0.95rem; display:flex; align-items:center; gap:10px;
  }
  .msg-warning {
    background:#fff8e1; border:2px solid #ffe082;
    color:#e65100; border-radius:10px;
    padding:14px 18px; margin-bottom:16px;
    font-weight:600; font-size:0.95rem; display:flex; align-items:center; gap:10px;
  }
  .msg-error {
    background:var(--red-bg); border:2px solid #ef9a9a;
    color:var(--red); border-radius:10px;
    padding:14px 18px; margin-bottom:16px;
    font-weight:600; font-size:0.95rem; display:flex; align-items:center; gap:10px;
  }

  /* Table */
  .table-wrap { overflow-x:auto; border-radius:8px; border:1px solid var(--gray-light); }
  table { width:100%; border-collapse:collapse; font-size:0.9rem; }
  thead th {
    background:var(--navy); color:var(--white);
    padding:11px 14px; text-align:left; font-weight:600; font-size:0.83rem;
    letter-spacing:0.04em; text-transform:uppercase;
  }
  tbody tr { border-bottom:1px solid var(--gray-light); transition:background 0.1s; }
  tbody tr:hover { background:#f5f7ff; }
  tbody tr:last-child { border-bottom:none; }
  tbody td { padding:10px 14px; }
  td .tag {
    display:inline-block; padding:2px 10px; border-radius:20px;
    font-size:0.8rem; font-weight:600;
  }
  td .tag.ok { background:var(--green-bg); color:var(--green); }
  td .tag.manual { background:#e8f4fd; color:#0277bd; }

  .btn-del {
    background:none; border:none; color:#ef5350; cursor:pointer;
    font-size:1.1rem; padding:4px 8px; border-radius:6px;
    transition:background 0.1s;
  }
  .btn-del:hover { background:var(--red-bg); }

  /* Stats grid */
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:24px; }
  .stat-card {
    background:var(--white); border-radius:10px;
    padding:20px; box-shadow:0 2px 8px rgba(26,39,68,0.09);
    text-align:center;
  }
  .stat-card .num { font-size:2rem; font-weight:800; color:var(--navy); }
  .stat-card .label { font-size:0.82rem; color:var(--gray); margin-top:4px; }

  /* Course list */
  .course-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .course-item {
    background:var(--white); border-radius:10px;
    border: 2px solid var(--gray-light);
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; transition:all 0.15s;
  }
  .course-item:hover { border-color:var(--gold); transform:translateY(-1px); }
  .course-item .cname { font-weight:700; color:var(--navy); }
  .course-item .cpct { font-size:0.82rem; color:var(--gray); }
  .course-item .bar-bg {
    width:60px; height:6px; background:var(--gray-light); border-radius:3px; margin-top:6px;
  }
  .course-item .bar-fill { height:6px; background:var(--gold); border-radius:3px; }

  /* Export */
  .btn-export {
    display:inline-flex; align-items:center; gap:8px;
    background:var(--navy); color:var(--white);
    border:none; padding:11px 22px; border-radius:8px;
    font-size:0.9rem; font-weight:600; cursor:pointer;
    transition:all 0.15s; text-decoration:none;
  }
  .btn-export:hover { background:var(--navy-light); }

  .empty { text-align:center; padding:40px; color:var(--gray); font-size:0.95rem; }

  /* Mobile */
  @media(max-width:600px){
    .header-inner { padding:12px 16px; }
    .header-title h1 { font-size:1rem; }
    main { padding:16px 12px; }
    .card { padding:18px; }
    .found-card { flex-direction:column; }
  }

  /* Toast */
  #toast {
    position:fixed; bottom:28px; right:24px; z-index:999;
    background:var(--navy); color:var(--white);
    padding:14px 22px; border-radius:10px;
    font-size:0.95rem; font-weight:600;
    box-shadow:0 8px 32px rgba(0,0,0,0.25);
    transform:translateY(80px); opacity:0;
    transition:all 0.25s;
    max-width:320px;
  }
  #toast.show { transform:translateY(0); opacity:1; }
  #toast.green { background:var(--green); }
  #toast.red { background:var(--red); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-left">
      <div class="logo-circle">LZ</div>
      <div class="header-title">
        <h1>Control de Comedor</h1>
        <p>Liceo Bicentenario Zapallar · 2026</p>
      </div>
    </div>
    <div id="live-clock">--:--:--</div>
  </div>
  <nav class="tabs">
    <button class="active" onclick="showPanel('registro')">🍽️ Registrar</button>
    <button onclick="showPanel('historial')">📋 Historial</button>
    <button onclick="showPanel('resumen')">📊 Resumen</button>
    <button onclick="showPanel('cursos')">🏫 Por Curso</button>
  </nav>
</header>

<main>

  <!-- PANEL: REGISTRO -->
  <div id="panel-registro" class="panel active">
    <div class="card">
      <h2>🔍 Buscar Alumno</h2>
      <div class="search-wrap">
        <span class="icon">🔎</span>
        <input type="text" id="search-input" placeholder="Buscar por RUT o nombre..." oninput="handleSearch()" autocomplete="off" />
      </div>
      <div id="search-msg"></div>
      <div id="search-results"></div>
    </div>

    <div class="card">
      <h2>✋ Registro Manual</h2>

      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
        <div style="flex:1;min-width:200px;">
          <label style="font-size:0.82rem;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;">Nombre</label>
          <input type="text" id="manual-name" placeholder="Nombre completo" style="width:100%;padding:10px 14px;border:2px solid var(--gray-light);border-radius:8px;font-size:0.95rem;">
        </div>
        <div style="flex:1;min-width:140px;">
          <label style="font-size:0.82rem;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;">RUT (opcional)</label>
          <input type="text" id="manual-rut" placeholder="12345678-9" style="width:100%;padding:10px 14px;border:2px solid var(--gray-light);border-radius:8px;font-size:0.95rem;">
        </div>
        <div style="flex:1;min-width:120px;">
          <label style="font-size:0.82rem;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;">Curso</label>
          <select id="manual-curso" style="width:100%;padding:10px 14px;border:2px solid var(--gray-light);border-radius:8px;font-size:0.95rem;">
            <option value="">-- Curso --</option>
            <option>7°A</option><option>7°B</option><option>7°C</option>
            <option>8°A</option><option>8°B</option><option>8°C</option>
            <option>1°A</option><option>1°B</option><option>1°C</option><option>1°D</option><option>1°E</option>
            <option>2°A</option><option>2°B</option><option>2°C</option><option>2°D</option><option>2°E</option>
            <option>3°A</option><option>3°B</option><option>3°C</option><option>3°D</option><option>3°E</option>
            <option>4°A</option><option>4°B</option><option>4°C</option><option>4°D</option><option>4°E</option>
            <option>Externo</option>
          </select>
        </div>
        <button class="btn-register" onclick="registerManual()">Registrar</button>
      </div>
    </div>
  </div>

  <!-- PANEL: HISTORIAL -->
  <div id="panel-historial" class="panel">
    <div class="card">
      <h2>📋 Historial de Registros</h2>
      <div class="filters">
        <input type="date" id="filter-date" onchange="renderHistorial()" />
        <select id="filter-curso" onchange="renderHistorial()">
          <option value="">Todos los cursos</option>
          <option>7°A</option><option>7°B</option><option>7°C</option>
          <option>8°A</option><option>8°B</option><option>8°C</option>
          <option>1°A</option><option>1°B</option><option>1°C</option><option>1°D</option><option>1°E</option>
          <option>2°A</option><option>2°B</option><option>2°C</option><option>2°D</option><option>2°E</option>
          <option>3°A</option><option>3°B</option><option>3°C</option><option>3°D</option><option>3°E</option>
          <option>4°A</option><option>4°B</option><option>4°C</option><option>4°D</option><option>4°E</option>
        </select>
        <input type="text" id="filter-name" placeholder="Filtrar por nombre..." oninput="renderHistorial()"
          style="padding:9px 14px;border:2px solid var(--gray-light);border-radius:8px;font-size:0.9rem;min-width:180px;">
        <button class="btn-export" onclick="exportCSV()">⬇️ Exportar CSV</button>
      </div>
      <div id="historial-container"></div>
    </div>
  </div>

  <!-- PANEL: RESUMEN -->
  <div id="panel-resumen" class="panel">
    <div class="card">
      <h2>📊 Resumen del Día</h2>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
        <input type="date" id="resumen-date" onchange="renderResumen()"
          style="padding:9px 14px;border:2px solid var(--gray-light);border-radius:8px;font-size:0.9rem;">
        <span style="font-size:0.88rem;color:var(--gray);">Seleccione una fecha para ver el resumen</span>
      </div>
      <div id="stats-grid" class="stats-grid"></div>
      <div id="resumen-table"></div>
    </div>
  </div>

  <!-- PANEL: CURSOS -->
  <div id="panel-cursos" class="panel">
    <div class="card">
      <h2>🏫 Asistencia por Curso</h2>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
        <input type="date" id="cursos-date" onchange="renderCursos()"
          style="padding:9px 14px;border:2px solid var(--gray-light);border-radius:8px;font-size:0.9rem;">
      </div>
      <div id="cursos-grid" class="course-grid"></div>
    </div>
    <div id="curso-detail-card" class="card" style="display:none;">
      <h2 id="curso-detail-title">Detalle</h2>
      <div id="curso-detail-content"></div>
    </div>
  </div>

</main>

<div id="toast"></div>

// Build lookup
const STUDENT_MAP = {};
STUDENTS.forEach(s => { STUDENT_MAP[s.rut] = s; });

// Count students per course
const COURSE_COUNTS = {};
STUDENTS.forEach(s => { COURSE_COUNTS[s.curso] = (COURSE_COUNTS[s.curso]||0)+1; });

// ===================== STATE =====================
let RECORDS = JSON.parse(localStorage.getItem('comedor_records') || '[]');

function saveRecords() {
  localStorage.setItem('comedor_records', JSON.stringify(RECORDS));
}

function todayStr() {
  return new Date().toISOString().slice(0,10);
}

// ===================== CLOCK =====================
function updateClock() {
  const now = new Date();
  document.getElementById('live-clock').textContent =
    now.toLocaleTimeString('es-CL', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// Set today's date in date pickers
window.addEventListener('DOMContentLoaded', () => {
  const today = todayStr();
  document.getElementById('filter-date').value = today;
  document.getElementById('resumen-date').value = today;
  document.getElementById('cursos-date').value = today;
  document.getElementById('search-input').focus();
  renderHistorial();
  renderResumen();
  renderCursos();
});

// ===================== TABS =====================
function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  const idx = ['registro','historial','resumen','cursos'].indexOf(name);
  document.querySelectorAll('nav.tabs button')[idx].classList.add('active');
  if(name==='historial') renderHistorial();
  if(name==='resumen') renderResumen();
  if(name==='cursos') renderCursos();
}

// ===================== SEARCH =====================
let searchTimeout;
function handleSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(doSearch, 180);
}

function normalize(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
}

function doSearch() {
  const q = normalize(document.getElementById('search-input').value.trim());
  const msg = document.getElementById('search-msg');
  const results = document.getElementById('search-results');

  if(q.length < 2) { msg.innerHTML=''; results.innerHTML=''; return; }

  const matches = STUDENTS.filter(s => {
    const rut = normalize(s.rut).replace(/[^0-9K]/g,'');
    const qRut = q.replace(/[^0-9K]/g,'');
    if(qRut.length >= 3 && rut.includes(qRut)) return true;
    return normalize(s.nombre).includes(q);
  }).slice(0, 8);

  msg.innerHTML = '';
  if(matches.length === 0) {
    results.innerHTML = '<div class="msg-error">⚠️ Alumno no encontrado en el listado.</div>';
    return;
  }
  results.innerHTML = matches.map(s => buildResultCard(s)).join('');
}

function buildResultCard(s) {
  const today = todayStr();
  const already = RECORDS.find(r => r.rut===s.rut && r.fecha===today);
  const nombre = s.nombre.split(' ').slice(0,4).join(' ');
  return `<div class="found-card">
    <div class="student-info">
      <div class="name">${nombre}</div>
      <div class="meta">RUT: ${s.rut} &nbsp;·&nbsp; <span class="badge-curso">${s.curso}</span></div>
    </div>
    ${already
      ? `<div class="msg-warning" style="margin:0;padding:10px 16px;">✅ Ya registrado hoy a las ${already.hora}</div>`
      : `<button class="btn-register" onclick='registerStudent(${JSON.stringify(s)})'>✔ Registrar</button>`
    }
  </div>`;
}

// ===================== REGISTER =====================
function registerStudent(s) {
  const today = todayStr();
  if(RECORDS.find(r => r.rut===s.rut && r.fecha===today)) {
    showToast('⚠️ Ya tiene registro hoy', 'red'); return;
  }
  const now = new Date();
  const rec = {
    id: Date.now(),
    rut: s.rut,
    nombre: s.nombre,
    curso: s.curso,
    fecha: today,
    hora: now.toLocaleTimeString('es-CL', {hour:'2-digit',minute:'2-digit',second:'2-digit'}),
    tipo: 'lista'
  };
  RECORDS.unshift(rec);
  saveRecords();
  showToast('✅ '+s.nombre.split(' ')[0]+' '+s.nombre.split(' ')[1]+' registrado/a', 'green');
  doSearch();
}

function registerManual() {
  const name = document.getElementById('manual-name').value.trim();
  const rut = document.getElementById('manual-rut').value.trim() || 'S/RUT';
  const curso = document.getElementById('manual-curso').value || 'S/CURSO';
  if(!name) { showToast('Ingresa el nombre del alumno', 'red'); return; }
  const now = new Date();
  const today = todayStr();
  const rec = {
    id: Date.now(),
    rut, nombre: name.toUpperCase(), curso,
    fecha: today,
    hora: now.toLocaleTimeString('es-CL', {hour:'2-digit',minute:'2-digit',second:'2-digit'}),
    tipo: 'manual'
  };
  RECORDS.unshift(rec);
  saveRecords();
  document.getElementById('manual-name').value = '';
  document.getElementById('manual-rut').value = '';
  document.getElementById('manual-curso').value = '';
  showToast('✅ '+name.split(' ')[0]+' registrado/a manualmente', 'green');
}

// ===================== HISTORIAL =====================
function renderHistorial() {
  const dateF = document.getElementById('filter-date').value;
  const cursoF = document.getElementById('filter-curso').value;
  const nameF = normalize(document.getElementById('filter-name').value);

  let recs = RECORDS.filter(r => {
    if(dateF && r.fecha !== dateF) return false;
    if(cursoF && r.curso !== cursoF) return false;
    if(nameF && !normalize(r.nombre).includes(nameF)) return false;
    return true;
  });

  const c = document.getElementById('historial-container');
  if(recs.length === 0) {
    c.innerHTML = '<div class="empty">📭 No hay registros con los filtros seleccionados.</div>';
    return;
  }

  c.innerHTML = `<p style="font-size:0.85rem;color:var(--gray);margin-bottom:12px;">${recs.length} registro(s) encontrado(s)</p>
  <div class="table-wrap">
  <table>
    <thead><tr>
      <th>Hora</th><th>Nombre</th><th>RUT</th><th>Curso</th><th>Tipo</th><th></th>
    </tr></thead>
    <tbody>
      ${recs.map(r => `<tr>
        <td>${r.hora}</td>
        <td style="font-weight:500">${r.nombre}</td>
        <td style="font-family:monospace">${r.rut}</td>
        <td><span class="tag ok">${r.curso}</span></td>
        <td><span class="tag ${r.tipo==='manual'?'manual':'ok'}">${r.tipo==='manual'?'Manual':'Lista'}</span></td>
        <td><button class="btn-del" onclick="deleteRecord(${r.id})" title="Eliminar">🗑</button></td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

function deleteRecord(id) {
  if(!confirm('¿Eliminar este registro?')) return;
  RECORDS = RECORDS.filter(r => r.id !== id);
  saveRecords();
  renderHistorial();
  showToast('Registro eliminado', 'red');
}

// ===================== RESUMEN =====================
function renderResumen() {
  const date = document.getElementById('resumen-date').value;
  const recs = RECORDS.filter(r => r.fecha === date);
  const sgrid = document.getElementById('stats-grid');
  const rtable = document.getElementById('resumen-table');

  const byCurso = {};
  recs.forEach(r => { byCurso[r.curso] = (byCurso[r.curso]||[]).concat(r); });

  sgrid.innerHTML = `
    <div class="stat-card"><div class="num">${recs.length}</div><div class="label">Total registrados</div></div>
    <div class="stat-card"><div class="num">${Object.keys(byCurso).length}</div><div class="label">Cursos presentes</div></div>
    <div class="stat-card"><div class="num">${recs.filter(r=>r.tipo==='lista').length}</div><div class="label">Del listado</div></div>
    <div class="stat-card"><div class="num">${recs.filter(r=>r.tipo==='manual').length}</div><div class="label">Manuales</div></div>
  `;

  if(recs.length === 0) {
    rtable.innerHTML = '<div class="empty">📭 Sin registros para esta fecha.</div>';
    return;
  }

  const sortedCursos = Object.keys(byCurso).sort();
  rtable.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Curso</th><th>Cant. Registrados</th><th>Total Matrícula</th><th>%</th></tr></thead>
    <tbody>
      ${sortedCursos.map(c => {
        const cnt = byCurso[c].length;
        const total = COURSE_COUNTS[c] || '—';
        const pct = typeof total === 'number' ? Math.round(cnt/total*100)+'%' : '—';
        return `<tr>
          <td style="font-weight:700">${c}</td>
          <td>${cnt}</td>
          <td>${total}</td>
          <td>${pct}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>`;
}

// ===================== CURSOS =====================
function renderCursos() {
  const date = document.getElementById('cursos-date').value;
  const recs = RECORDS.filter(r => r.fecha === date);
  const regByRut = {};
  recs.forEach(r => { regByRut[r.rut] = r; });

  const courses = ['7°A','7°B','7°C','8°A','8°B','8°C',
    '1°A','1°B','1°C','1°D','1°E',
    '2°A','2°B','2°C','2°D','2°E',
    '3°A','3°B','3°C','3°D','3°E',
    '4°A','4°B','4°C','4°D','4°E'];

  const grid = document.getElementById('cursos-grid');
  grid.innerHTML = courses.map(c => {
    const total = COURSE_COUNTS[c] || 0;
    const cnt = recs.filter(r => r.curso === c).length;
    const pct = total ? Math.round(cnt/total*100) : 0;
    return `<div class="course-item" onclick="showCursoDetail('${c}', '${date}')">
      <div>
        <div class="cname">${c}</div>
        <div class="cpct">${cnt} / ${total} alumnos</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div style="font-size:1.4rem;font-weight:800;color:var(--navy)">${pct}%</div>
    </div>`;
  }).join('');
}

function showCursoDetail(curso, date) {
  const card = document.getElementById('curso-detail-card');
  const title = document.getElementById('curso-detail-title');
  const content = document.getElementById('curso-detail-content');
  card.style.display = 'block';
  title.textContent = `Detalle: ${curso} — ${date}`;

  const registered = new Set(RECORDS.filter(r => r.fecha===date && r.curso===curso).map(r => r.rut));
  const students = STUDENTS.filter(s => s.curso===curso);

  const present = students.filter(s => registered.has(s.rut));
  const absent = students.filter(s => !registered.has(s.rut));

  content.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px;">
      <div>
        <h3 style="color:var(--green);margin-bottom:12px;font-size:0.95rem;">✅ Presentes (${present.length})</h3>
        ${present.length === 0 ? '<p style="color:var(--gray);font-size:0.88rem">Ninguno registrado</p>' :
          present.map(s => `<div style="padding:5px 0;border-bottom:1px solid var(--gray-light);font-size:0.88rem">
            ${s.nombre.split(' ').slice(0,3).join(' ')}
          </div>`).join('')}
      </div>
      <div>
        <h3 style="color:var(--red);margin-bottom:12px;font-size:0.95rem;">❌ Ausentes (${absent.length})</h3>
        ${absent.length === 0 ? '<p style="color:var(--gray);font-size:0.88rem">¡Todos registrados!</p>' :
          absent.map(s => `<div style="padding:5px 0;border-bottom:1px solid var(--gray-light);font-size:0.88rem;color:var(--gray)">
            ${s.nombre.split(' ').slice(0,3).join(' ')}
          </div>`).join('')}
      </div>
    </div>
  `;
  card.scrollIntoView({behavior:'smooth', block:'start'});
}

// ===================== EXPORT CSV =====================
function exportCSV() {
  const dateF = document.getElementById('filter-date').value;
  const cursoF = document.getElementById('filter-curso').value;
  let recs = RECORDS.filter(r => {
    if(dateF && r.fecha !== dateF) return false;
    if(cursoF && r.curso !== cursoF) return false;
    return true;
  });
  if(recs.length===0) { showToast('No hay registros para exportar', 'red'); return; }

  const header = 'Fecha,Hora,RUT,Nombre,Curso,Tipo';
  const rows = recs.map(r =>
    [r.fecha, r.hora, r.rut, '"'+r.nombre+'"', r.curso, r.tipo].join(',')
  );
  const csv = [header, ...rows].join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `comedor_${dateF||'todos'}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast('✅ CSV exportado', 'green');
}

// ===================== TOAST =====================
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.className='', 2800);
}
</script>
